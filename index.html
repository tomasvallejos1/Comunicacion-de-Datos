<style>
:root{
  --ink:#0e1726;--ink-2:#16263a;--line:#2b3852;
  --accent:#d7402b;--blue:#4f8fdc;--teal:#39b3a6;--violet:#a07ad0;--gold:#e6a300;
  --bar:56px; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;width:100%}
body{font-family:'Space Grotesk',sans-serif;background:var(--ink);color:#fff;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;}
.topbar{height:var(--bar);display:flex;align-items:stretch;background:var(--ink);
  border-bottom:3px solid var(--accent);position:relative;z-index:20;flex-shrink:0;overflow:hidden;}
.tb-brand{display:flex;align-items:center;padding:0 14px 0 16px;flex-shrink:0;border-right:1px solid var(--line);}
.tb-brand .mark{font-family:'Fraunces',serif;font-weight:900;font-size:1.05rem;line-height:1;letter-spacing:-.4px;white-space:nowrap}
.tb-brand .mark small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;color:#7d8ba6;font-weight:400;margin-top:3px;text-transform:uppercase}
.tb-toggle{background:none;border:none;color:#cdd6e6;cursor:pointer;font-size:1.15rem;
  width:46px;min-width:46px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.15s;border-right:1px solid var(--line);}
.tb-toggle:hover{background:var(--ink-2);color:#fff}
.tb-toggle.off{color:#5e6c86}
.tabs{display:flex;align-items:stretch;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 16px;background:none;border:none;
  color:#9aa7bf;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;
  white-space:nowrap;position:relative;transition:.15s;border-right:1px solid var(--line);flex-shrink:0;}
.tab:hover{background:var(--ink-2);color:#fff}
.tab .tn{font-family:var(--mono);font-size:.66rem;font-weight:700;padding:2px 6px;border-radius:5px;
  background:#26344c;color:#9aa7bf;transition:.15s;white-space:nowrap;flex-shrink:0;}
.tab.active{color:#fff;background:var(--ink-2)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--c,var(--accent));}
.tab.active .tn{background:var(--c,var(--accent));color:#fff}
.tab[data-c="u1"]{--c:var(--blue)}.tab[data-c="u2"]{--c:var(--teal)}
.tab[data-c="u3"]{--c:var(--violet)}.tab[data-c="gt"]{--c:var(--gold)}
.stage{position:relative;height:calc(100vh - var(--bar));width:100%;overflow:hidden;background:#f4f1ea;}

/* ── FRAMES ────────────────────────────────────────────────────────────────
   Inactive = display:none → completely off-screen, impossible to "show through"
   Active   = display:block → opacity 1
   ──────────────────────────────────────────────────────────────────────── */
.frame{position:absolute;inset:0;width:100%;height:100%;border:none;
  background:#f4f1ea;display:none;opacity:0;max-width:100%;max-height:100%;}
.frame.visible{display:block;}
.frame.active{opacity:1;transition:opacity .15s;}

.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:#f4f1ea;color:#33415c;z-index:5;transition:opacity .3s;}
.loader.gone{opacity:0;pointer-events:none}
.loader .ring{width:38px;height:38px;border:4px solid #d8d0bf;border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loader .lbl{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em}

@media(max-width:520px){
  :root{--bar:52px}
  .tb-brand .mark{font-size:.9rem}
  .tb-brand .mark small{display:none}
  .tb-toggle{width:40px;min-width:40px;font-size:1rem}
  .tab{padding:0 11px;font-size:.8rem;gap:5px}
  .tab .label-long{display:none}
  .tab .tn{padding:2px 5px;font-size:.62rem}
}
</style>

<script>
(function(){
  'use strict';
  var TABS   = ['u1','u2','u3','gt'];
  var NO_SB  = {gt:1};
  var loaded = {};
  var current = null;
  var sbHidden = false;

  function decode(id){
    var b64=document.getElementById('payload-'+id).textContent.trim();
    var bin=atob(b64); var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function pushSidebar(id){
    if(NO_SB[id]) return;
    try{ document.getElementById('f-'+id).contentWindow
           .postMessage({__shell:'toggleSidebar',hide:sbHidden},'*'); }catch(e){}
  }

  function setVisible(id){
    TABS.forEach(function(t){
      var f=document.getElementById('f-'+t);
      var b=document.querySelector('.tab[data-tab="'+t+'"]');
      if(t===id){
        f.classList.add('visible');
        requestAnimationFrame(function(){requestAnimationFrame(function(){f.classList.add('active');});});
        b.classList.add('active');
      } else {
        f.classList.remove('active');
        // wait for fade, then display:none
        (function(el){setTimeout(function(){if(!el.classList.contains('active'))el.classList.remove('visible');},250);})(f);
        b.classList.remove('active');
      }
    });
    document.getElementById('sbToggle').style.visibility=NO_SB[id]?'hidden':'visible';
  }

  function loadFrame(id){
    if(loaded[id]) return;
    loaded[id]=true;
    var f=document.getElementById('f-'+id);
    f.addEventListener('load',function onLoad(){
      f.removeEventListener('load',onLoad);
      pushSidebar(id);
      if(id==='u1') document.getElementById('loader').classList.add('gone');
    });
    f.srcdoc=decode(id);
  }

  function activate(id){
    if(id===current) return;
    current=id;
    setVisible(id);
    loadFrame(id);
    if(loaded[id]) pushSidebar(id);
  }

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){activate(b.dataset.tab);});
  });

  document.getElementById('sbToggle').addEventListener('click',function(){
    sbHidden=!sbHidden;
    var btn=document.getElementById('sbToggle');
    btn.innerHTML=sbHidden?'&#x2B9E;':'&#x2B9C;';
    btn.title=sbHidden?'Mostrar menu':'Ocultar menu';
    btn.classList.toggle('off',sbHidden);
    TABS.forEach(function(t){if(loaded[t])pushSidebar(t);});
  });

  activate('u1');
})();
</script>
</body>
