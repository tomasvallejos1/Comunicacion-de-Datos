<style>
:root{
  --ink:#0e1726;--ink-2:#16263a;--paper:#f4f1ea;--line:#2b3852;
  --accent:#d7402b;--blue:#4f8fdc;--teal:#39b3a6;--violet:#a07ad0;--gold:#e6a300;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Space Grotesk',sans-serif;background:var(--ink);color:#fff;overflow:hidden}

/* ---- Top bar ---- */
.topbar{
  height:60px;display:flex;align-items:stretch;background:var(--ink);
  border-bottom:3px solid var(--accent);position:relative;z-index:20;
}
.tb-brand{display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0;border-right:1px solid var(--line)}
.tb-brand .mark{font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;line-height:1;letter-spacing:-.5px}
.tb-brand .mark small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;color:#7d8ba6;font-weight:400;margin-top:3px;text-transform:uppercase}
.tb-toggle{
  background:none;border:none;color:#cdd6e6;cursor:pointer;font-size:1.3rem;
  width:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;border-right:1px solid var(--line)
}
.tb-toggle:hover{background:var(--ink-2);color:#fff}
.tb-toggle.off{color:#5e6c86}

.tabs{display:flex;align-items:stretch;flex:1;overflow-x:auto}
.tab{
  display:flex;align-items:center;gap:9px;padding:0 20px;background:none;border:none;
  color:#9aa7bf;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:.92rem;font-weight:600;
  white-space:nowrap;position:relative;transition:.15s;border-right:1px solid var(--line)
}
.tab:hover{background:var(--ink-2);color:#fff}
.tab .tn{font-family:var(--mono);font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:#26344c;color:#9aa7bf;transition:.15s}
.tab.active{color:#fff;background:var(--ink-2)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--c,var(--accent))}
.tab.active .tn{background:var(--c,var(--accent));color:#fff}
.tab[data-c="u1"]{--c:var(--blue)}
.tab[data-c="u2"]{--c:var(--teal)}
.tab[data-c="u3"]{--c:var(--violet)}
.tab[data-c="gt"]{--c:var(--gold)}

/* ---- Frame area ---- */
.stage{position:relative;height:calc(100vh - 60px);background:#f4f1ea}
.frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#f4f1ea;opacity:0;pointer-events:none;transition:opacity .25s}
.frame.active{opacity:1;pointer-events:auto}

/* loader */
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f4f1ea;color:#33415c;z-index:5;transition:opacity .3s}
.loader.hide{opacity:0;pointer-events:none}
.loader .ring{width:40px;height:40px;border:4px solid #d8d0bf;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader .lbl{font-family:var(--mono);font-size:.8rem;letter-spacing:.06em}

@media(max-width:680px){
  .tb-brand .mark{font-size:1rem}
  .tab{padding:0 13px;font-size:.84rem}
  .tab .label-long{display:none}
}
</style>

<script>
const TABS=['u1','u2','u3','gt'];
const loaded={};
let sidebarHidden=false;

function decodePayload(id){
  const b64=document.getElementById('payload-'+id).textContent.trim();
  // base64 -> UTF-8 string
  const bin=atob(b64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function loadFrame(id){
  if(loaded[id])return;
  const f=document.getElementById('f-'+id);
  f.srcdoc=decodePayload(id);
  loaded[id]=true;
  // push current sidebar state once it loads
  f.addEventListener('load',()=>{
    pushSidebar(id);
    if(id==='u1') document.getElementById('loader').classList.add('hide');
  },{once:true});
}

function pushSidebar(id){
  if(id==='gt')return; // global test has no unit sidebar
  const f=document.getElementById('f-'+id);
  try{ f.contentWindow.postMessage({__shell:'toggleSidebar',hide:sidebarHidden},'*'); }catch(e){}
}

function activate(id){
  TABS.forEach(t=>{
    document.getElementById('f-'+t).classList.toggle('active',t===id);
    document.querySelector('.tab[data-tab="'+t+'"]').classList.toggle('active',t===id);
  });
  loadFrame(id);
  // toggle availability of the sidebar button
  const btn=document.getElementById('sbToggle');
  if(id==='gt'){btn.style.visibility='hidden';}
  else{btn.style.visibility='visible';pushSidebar(id);}
}

document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click',()=>activate(b.dataset.tab));
});

document.getElementById('sbToggle').addEventListener('click',()=>{
  sidebarHidden=!sidebarHidden;
  const btn=document.getElementById('sbToggle');
  btn.textContent=sidebarHidden?'⮞':'⮜';
  btn.classList.toggle('off',sidebarHidden);
  btn.title=sidebarHidden?'Mostrar menú lateral':'Ocultar menú lateral';
  TABS.forEach(t=>{ if(loaded[t]) pushSidebar(t); });
});

// initial load
loadFrame('u1');
</script>
</body>
</html>
