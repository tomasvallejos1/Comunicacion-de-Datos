<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicación de Datos · Unidad 3 — Estudio Interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#11161f;
  --ink-soft:#2a3242;
  --paper:#f4efe6;
  --paper-2:#ece4d6;
  --card:#fbf8f1;
  --line:#d8cdb9;
  --orange:#e8642a;
  --orange-deep:#c44a16;
  --teal:#1d8a8a;
  --teal-deep:#0f5f5f;
  --blue:#2f5fb0;
  --gold:#d9a441;
  --green:#3f8f54;
  --red:#cc4444;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 18px 40px -20px rgba(17,22,31,.35);
  --shadow-lg:0 30px 70px -28px rgba(17,22,31,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(232,100,42,.06), transparent 40%),
    radial-gradient(circle at 88% 92%, rgba(29,138,138,.07), transparent 42%);
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Fraunces',serif;line-height:1.1;font-weight:600}
code,.mono{font-family:'JetBrains Mono',monospace}

/* ---------- Layout shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:280px;flex-shrink:0;background:var(--ink);color:#e8e1d4;
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 40px;
  border-right:3px solid var(--orange);
  z-index:50;
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:#39414f;border-radius:4px}
.brand{padding:26px 24px 18px;border-bottom:1px solid #2a3140}
.brand .tag{font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;color:var(--orange);text-transform:uppercase}
.brand h1{font-size:25px;color:#fff;margin-top:8px;font-weight:700}
.brand .sub{font-size:12.5px;color:#9aa3b2;margin-top:6px}
.progress-wrap{padding:14px 24px 8px}
.progress-label{font-size:11px;color:#9aa3b2;font-family:'JetBrains Mono';display:flex;justify-content:space-between}
.progress-bar{height:7px;background:#2a3140;border-radius:4px;margin-top:7px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width .5s ease;border-radius:4px}
nav.menu{padding:10px 12px}
nav.menu a{
  display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:9px;
  color:#c3cad7;text-decoration:none;font-size:13.7px;font-weight:500;margin-bottom:2px;
  transition:.18s;cursor:pointer;position:relative;
}
nav.menu a .ix{font-family:'JetBrains Mono';font-size:11px;width:22px;color:#737d8d;flex-shrink:0}
nav.menu a:hover{background:#1d2430;color:#fff}
nav.menu a.active{background:var(--orange);color:#fff}
nav.menu a.active .ix{color:#ffd9c4}
nav.menu a .done{margin-left:auto;color:var(--green);font-size:13px;opacity:0;transition:.2s}
nav.menu a.seen .done{opacity:1}
.menu-divider{font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.5px;color:#646e7e;text-transform:uppercase;padding:16px 16px 6px}

main{flex:1;min-width:0}
.topbar{
  display:none;position:sticky;top:0;z-index:60;background:var(--ink);
  color:#fff;padding:12px 18px;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--orange);
}
.topbar h1{font-size:17px}
.burger{background:var(--orange);border:none;color:#fff;width:42px;height:38px;border-radius:9px;font-size:20px;cursor:pointer}
.content{max-width:920px;margin:0 auto;padding:46px 40px 120px}

/* ---------- Sections ---------- */
.section{display:none;animation:fade .45s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--orange-deep);font-weight:700;background:rgba(232,100,42,.1);padding:6px 13px;border-radius:30px;margin-bottom:18px}
.section > h2{font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:-.5px;margin-bottom:10px}
.section > h2 .accent{color:var(--orange)}
.lead{font-size:18px;color:var(--ink-soft);max-width:680px;margin-bottom:30px}
h3.block{font-size:25px;margin:42px 0 14px;display:flex;align-items:center;gap:12px}
h3.block::before{content:"";width:14px;height:14px;background:var(--orange);border-radius:3px;transform:rotate(45deg);flex-shrink:0}
h4.sub{font-size:19px;margin:26px 0 10px;color:var(--teal-deep)}
p{margin-bottom:14px;font-size:15.6px;color:var(--ink-soft)}
p strong,li strong{color:var(--ink);font-weight:600}
ul.bullets{margin:0 0 16px 4px;padding-left:20px}
ul.bullets li{margin-bottom:7px;font-size:15.4px;color:var(--ink-soft)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow);margin:20px 0}
.card.flush{padding:0;overflow:hidden}
.keyconcept{
  background:linear-gradient(135deg,#fff7ec,#fdeede);border:1px solid #f0d2b3;
  border-left:5px solid var(--orange);border-radius:12px;padding:16px 20px;margin:20px 0;
}
.keyconcept .kc-label{font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.5px;color:var(--orange-deep);font-weight:700;text-transform:uppercase;display:block;margin-bottom:5px}
.keyconcept p{margin:0;color:#5b3d28;font-size:15px}

.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}

/* tables */
table.tbl{width:100%;border-collapse:collapse;margin:18px 0;font-size:14.4px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
table.tbl th{background:var(--ink);color:#fff;text-align:left;padding:11px 15px;font-family:'Space Grotesk';font-weight:600;font-size:13px;letter-spacing:.3px}
table.tbl td{padding:10px 15px;border-top:1px solid var(--line);color:var(--ink-soft);vertical-align:top}
table.tbl tr:nth-child(even) td{background:rgba(0,0,0,.018)}
table.tbl td strong{color:var(--ink)}

.codeblock{background:var(--ink);color:#d9e0ec;border-radius:12px;padding:16px 18px;font-family:'JetBrains Mono';font-size:13px;line-height:1.7;overflow-x:auto;margin:16px 0;white-space:pre;border:1px solid #2a3140}
.codeblock .c-or{color:#ffa06b}
.codeblock .c-te{color:#5fd3d3}
.codeblock .c-mu{color:#8a93a5}

.pill{display:inline-block;padding:3px 11px;border-radius:30px;font-size:12px;font-family:'JetBrains Mono';font-weight:500}
.pill.guiado{background:#e3f0ef;color:var(--teal-deep)}
.pill.noguiado{background:#fce8df;color:var(--orange-deep)}

.fig-cap{font-size:12.5px;color:#8a8170;font-style:italic;text-align:center;margin-top:8px}

/* interactive generic */
.lab{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:22px 0;box-shadow:var(--shadow)}
.lab-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.lab-head .badge{background:var(--teal);color:#fff;font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.5px;padding:5px 10px;border-radius:20px;text-transform:uppercase;font-weight:700}
.lab-head h4{font-size:18px;color:var(--ink);margin:0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.btn{font-family:'Space Grotesk';font-weight:600;font-size:14px;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;transition:.15s;background:var(--ink);color:#fff}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.btn.orange{background:var(--orange)}
.btn.teal{background:var(--teal)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:4px;gap:3px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--ink-soft);transition:.15s}
.seg button.on{background:var(--ink);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;background:var(--paper-2);border-radius:5px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;border:3px solid #fff}
.slider-row{display:flex;align-items:center;gap:14px;margin:12px 0}
.slider-row label{min-width:130px;font-size:13.5px;font-weight:600;color:var(--ink)}
.slider-row .val{font-family:'JetBrains Mono';font-size:13px;color:var(--orange-deep);font-weight:700;min-width:74px}
canvas{display:block;width:100%;border-radius:10px}
.readout{font-family:'JetBrains Mono';font-size:13.5px;background:var(--paper-2);border-radius:10px;padding:13px 16px;margin-top:12px;line-height:1.8}
.readout b{color:var(--orange-deep)}

/* quiz */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.q-num{font-family:'JetBrains Mono';font-size:12px;color:var(--orange-deep);font-weight:700;letter-spacing:1px}
.q-text{font-size:16.5px;font-weight:600;color:var(--ink);margin:6px 0 14px;font-family:'Fraunces'}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-family:'Space Grotesk';font-size:14.5px;color:var(--ink-soft);transition:.15s}
.opt:hover{border-color:var(--orange);background:#fff8f2}
.opt .k{font-family:'JetBrains Mono';font-weight:700;color:var(--orange-deep);margin-right:9px}
.opt.correct{background:#e7f5ea;border-color:var(--green);color:#1f5e30}
.opt.wrong{background:#fbe9e9;border-color:var(--red);color:#8a2b2b}
.opt.locked{cursor:default}
.q-feedback{font-size:13.8px;margin-top:8px;padding:10px 14px;border-radius:9px;display:none}
.q-feedback.show{display:block}
.q-feedback.ok{background:#e7f5ea;color:#1f5e30}
.q-feedback.no{background:#fbe9e9;color:#8a2b2b}
.quiz-score{position:sticky;top:14px;z-index:10;background:var(--ink);color:#fff;border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;box-shadow:var(--shadow-lg)}
.quiz-score .sc{font-family:'JetBrains Mono';font-size:22px;font-weight:700}
.quiz-score .sc small{font-size:13px;color:#9aa3b2}

/* develop questions */
.dev-q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0;box-shadow:var(--shadow)}
.dev-q .q{font-family:'Fraunces';font-size:17px;font-weight:600;color:var(--ink);margin-bottom:12px}
.dev-q textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-family:'Space Grotesk';font-size:14.5px;resize:vertical;color:var(--ink);background:#fff}
.dev-q textarea:focus{outline:none;border-color:var(--teal)}
.model-ans{margin-top:12px;background:#eef6f6;border-left:4px solid var(--teal);border-radius:8px;padding:14px 16px;display:none}
.model-ans.show{display:block;animation:fade .3s}
.model-ans .ma-label{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:1.5px;color:var(--teal-deep);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.model-ans p{font-size:14px;color:#274d4d;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;font-family:'JetBrains Mono';color:var(--teal-deep)}

/* hero home */
.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--ink);color:#fff;padding:48px 44px;margin-bottom:30px;border:1px solid #2a3140}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 85% 20%,rgba(232,100,42,.35),transparent 45%),
  radial-gradient(circle at 10% 90%,rgba(29,138,138,.3),transparent 45%);pointer-events:none}
.hero .tag{font-family:'JetBrains Mono';font-size:12px;letter-spacing:3px;color:var(--orange);text-transform:uppercase}
.hero h2{font-size:clamp(32px,6vw,52px);color:#fff;margin:14px 0;font-weight:900;position:relative}
.hero p{color:#c3cad7;font-size:17px;max-width:560px;position:relative}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:24px}
.home-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.home-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--orange)}
.home-card .hc-ix{font-family:'JetBrains Mono';font-size:12px;color:var(--orange-deep);font-weight:700}
.home-card h4{font-size:18px;margin:8px 0 6px;color:var(--ink)}
.home-card p{font-size:13.5px;color:var(--ink-soft);margin:0}
.home-card .hc-icon{font-size:26px;margin-bottom:6px;display:block}

.statbar{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.stat{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.stat .n{font-family:'Fraunces';font-size:32px;font-weight:900;color:var(--orange)}
.stat .l{font-size:13px;color:var(--ink-soft)}

.next-btn{display:inline-flex;align-items:center;gap:9px;margin-top:40px;background:var(--ink);color:#fff;text-decoration:none;padding:13px 22px;border-radius:11px;font-weight:600;font-size:15px;cursor:pointer;transition:.18s;border:none;font-family:'Space Grotesk'}
.next-btn:hover{background:var(--orange);transform:translateX(4px)}

.svg-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0;box-shadow:var(--shadow)}
.svg-wrap svg{width:100%;height:auto;display:block}

.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}

/* constellation grid */
.const-pt{transition:.2s}

@media(max-width:880px){
  .sidebar{position:fixed;left:0;transform:translateX(-100%);transition:.3s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .topbar{display:flex}
  .content{padding:28px 20px 100px}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .slider-row{flex-wrap:wrap}
  .slider-row label{min-width:100%}
  .scrim.open{display:block}
  table.tbl{font-size:13px}
  .hero{padding:32px 24px}
}
</style>
</head>
<body>
<div class="scrim" id="scrim" onclick="closeNav()"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="tag">UTN · FRVT · 2026</div>
      <h1>Comunicación de Datos</h1>
      <div class="sub">Unidad 3 — Medios, señales, codificación, modulación y multiplexación</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>PROGRESO</span><span id="progPct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>
    <nav class="menu" id="menu"></nav>
  </aside>

  <main>
    <div class="topbar">
      <button class="burger" onclick="openNav()">☰</button>
      <h1>Unidad 3 — Interactiva</h1>
      <span style="width:42px"></span>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
/* =========================================================
   Comunicación de Datos · Unidad 3 — App interactiva
   ========================================================= */

const SECTIONS = [
  {id:'inicio',    ix:'00', icon:'🏠', label:'Inicio',                    group:'Comenzar'},
  {id:'mapa',      ix:'01', icon:'🗺️', label:'Mapa general',              group:'Teoría'},
  {id:'medios',    ix:'02', icon:'🔌', label:'Medios de transmisión',     group:'Teoría'},
  {id:'noguiados', ix:'03', icon:'📡', label:'Medios no guiados',         group:'Teoría'},
  {id:'senales',   ix:'04', icon:'〰️', label:'Señales y transmisión',     group:'Teoría'},
  {id:'decibel',   ix:'05', icon:'🔉', label:'dB, dBm y SNR',             group:'Teoría'},
  {id:'capacidad', ix:'06', icon:'📈', label:'Nyquist y Shannon',         group:'Teoría'},
  {id:'codif',     ix:'07', icon:'📟', label:'Códigos de línea',          group:'Teoría'},
  {id:'modul',     ix:'08', icon:'🌀', label:'Modulación digital',        group:'Teoría'},
  {id:'pcm',       ix:'09', icon:'🎙️', label:'PCM y mod. delta',          group:'Teoría'},
  {id:'multiplex', ix:'10', icon:'🧬', label:'Multiplexación',            group:'Teoría'},
  {id:'tcpip',     ix:'11', icon:'🏗️', label:'TCP/IP y encapsulado',      group:'Teoría'},
  {id:'conmuta',   ix:'12', icon:'🔀', label:'Conmutación',               group:'Teoría'},
  {id:'quiz',      ix:'13', icon:'✅', label:'Quiz interactivo',          group:'Evaluación'},
  {id:'desarrollo',ix:'14', icon:'✍️', label:'Preguntas de desarrollo',   group:'Evaluación'},
  {id:'flash',     ix:'15', icon:'🎴', label:'Flashcards',                group:'Evaluación'},
];

const seen = new Set();
let current = 'inicio';

/* ---------- helpers de plantilla ---------- */
function keyConcept(txt){
  return `<div class="keyconcept"><span class="kc-label">Concepto clave</span><p>${txt}</p></div>`;
}
function fig(svg,cap){
  return `<div class="svg-wrap">${svg}${cap?`<div class="fig-cap">${cap}</div>`:''}</div>`;
}
function nextBtn(to,label){
  return `<button class="next-btn" onclick="go('${to}')">${label||'Siguiente'} →</button>`;
}

/* =========================================================
   CONTENIDO TEÓRICO
   ========================================================= */
const CONTENT = {};

/* ---------- INICIO ---------- */
CONTENT.inicio = `
<div class="hero">
  <div class="tag">Resumen interactivo · orientado al parcial</div>
  <h2>Unidad 3<br>de la señal al paquete</h2>
  <p>¿Cómo se convierte la información en señales, cómo viajan por un medio y cómo se aprovecha al máximo la capacidad del canal? Recorré la teoría con diagramas y laboratorios, después poné a prueba lo que aprendiste.</p>
</div>

<div class="statbar">
  <div class="stat"><div class="n">13</div><div class="l">módulos de teoría</div></div>
  <div class="stat"><div class="n">8</div><div class="l">laboratorios interactivos</div></div>
  <div class="stat"><div class="n">15</div><div class="l">preguntas de quiz</div></div>
  <div class="stat"><div class="n">5</div><div class="l">preguntas de desarrollo</div></div>
</div>

<h3 class="block">Cómo usar esta web</h3>
<p>Cada módulo combina <strong>explicación + diagrama + laboratorio</strong>. Los laboratorios te dejan mover sliders, dibujar señales y ver fórmulas en vivo. Al final, evaluá tu aprendizaje con el quiz autocorregido, las preguntas de desarrollo con respuesta modelo, y las flashcards.</p>

<div class="home-grid" id="homeGrid"></div>

<h3 class="block">Lo central para el parcial</h3>
<table class="tbl">
  <tr><th>Eje</th><th>Qué tenés que dominar</th></tr>
  <tr><td><strong>Conmutación</strong></td><td>Circuitos vs paquetes: diferencias, ventajas y desventajas.</td></tr>
  <tr><td><strong>TCP/IP</strong></td><td>Capas, funciones, encapsulamiento y cabeceras.</td></tr>
  <tr><td><strong>Capacidad de canal</strong></td><td>Teoremas de Nyquist y Shannon.</td></tr>
  <tr><td><strong>Señales</strong></td><td>Amplitud, período, fase, frecuencia, dominio temporal/frecuencial, atenuación, ruido.</td></tr>
  <tr><td><strong>Modulación</strong></td><td>ASK, FSK, PSK y QAM.</td></tr>
  <tr><td><strong>Multiplexación</strong></td><td>FDM, TDM y TDM estadística.</td></tr>
</table>

<div class="keyconcept"><span class="kc-label">Fuera de foco para esta instancia</span><p>Detección/corrección de errores (cap. 6), control de enlace y de flujo, ATM en detalle, IGMP/ICMP, detalles de SONET/SDH e historia de los cable módems. Se mencionan, pero no se profundizan.</p></div>

${nextBtn('mapa','Empezar por el mapa general')}
`;

/* ---------- 1. MAPA GENERAL ---------- */
CONTENT.mapa = `
<span class="kicker">Módulo 01 · Ubicación</span>
<h2>Mapa general: <span class="accent">dónde entra la U3</span></h2>

function dpiCanvas(c,h){
  const dpr=window.devicePixelRatio||1;
  const w=c.clientWidth||600;
  c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}

/* ---- Antena: patrón de radiación ---- */
let antMode='omni',antAnim;
function setAnt(m,btn){document.querySelectorAll('#antSeg button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');antMode=m;}
function initAntenna(){
  const c=document.getElementById('antCanvas');if(!c)return;
  cancelAnimationFrame(antAnim);let t=0;
  function draw(){
    const {ctx,w,h}=dpiCanvas(c,300);
    ctx.clearRect(0,0,w,h);
    const cx=w/2,cy=h/2;
    // antena
    ctx.fillStyle='#11161f';ctx.fillRect(cx-3,cy-2,6,40);
    ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.fillStyle='#e8642a';ctx.fill();
    if(antMode==='omni'){
      for(let r=0;r<4;r++){
        const rad=((t*0.9+r*45)%180)/180*Math.min(w,h)*0.46;
        ctx.beginPath();ctx.arc(cx,cy,rad,0,7);
        ctx.strokeStyle='rgba(29,138,138,'+(1-rad/(Math.min(w,h)*0.46))*0.8+')';
        ctx.lineWidth=2.4;ctx.stroke();
      }
      document.getElementById('antReadout').innerHTML='<b>Omnidireccional</b> — irradia energía en todas las direcciones por igual. Ideal para difusión (radio, AP Wi-Fi), pero la potencia se reparte y el alcance dirigido es menor.';
    }else{
      const ang=-Math.PI/2,spread=0.5;
      for(let r=0;r<4;r++){
        const rad=((t*1.2+r*40)%160)/160*Math.min(w,h)*0.5;
        ctx.beginPath();
        ctx.arc(cx,cy,rad,ang-spread,ang+spread);
        ctx.strokeStyle='rgba(232,100,42,'+(1-rad/(Math.min(w,h)*0.5))*0.9+')';
        ctx.lineWidth=3;ctx.stroke();
      }
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(ang-spread)*w,cy+Math.sin(ang-spread)*w);
      ctx.lineTo(cx+Math.cos(ang+spread)*w,cy+Math.sin(ang+spread)*w);
      ctx.closePath();ctx.fillStyle='rgba(232,100,42,.06)';ctx.fill();
      document.getElementById('antReadout').innerHTML='<b>Direccional</b> — concentra la energía en un haz (mayor ganancia). Aumenta el alcance y el SNR en una dirección, pero requiere alineación y muchas veces línea de vista (enlaces punto a punto).';
    }
    t+=1.4;antAnim=requestAnimationFrame(draw);
  }
  draw();
}

/* ---- Señales: senoidal ---- */
function initSignals(){
  const c=document.getElementById('sineCanvas');if(!c)return;
  const A=document.getElementById('sAmp'),F=document.getElementById('sFreq'),P=document.getElementById('sPhase');
  function draw(){
    const {ctx,w,h}=dpiCanvas(c,240);
    ctx.clearRect(0,0,w,h);
    const amp=+A.value,freq=+F.value,ph=+P.value*Math.PI/180,mid=h/2;
    // grid
    ctx.strokeStyle='#e5dcc9';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();
    // wave
    ctx.beginPath();
    for(let x=0;x<=w;x++){
      const y=mid-Math.sin((x/w)*freq*2*Math.PI+ph)*amp;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle='#e8642a';ctx.lineWidth=2.6;ctx.stroke();
    // amplitude marker
    ctx.strokeStyle='#1d8a8a';ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(14,mid);ctx.lineTo(14,mid-amp);ctx.stroke();ctx.setLineDash([]);
    document.getElementById('sAmpV').textContent=amp+' u';
    document.getElementById('sFreqV').textContent=freq+' Hz';
    document.getElementById('sPhaseV').textContent=P.value+'°';
    document.getElementById('sineReadout').innerHTML=
      `s(t) = <b>${amp}</b>·sen(2π·<b>${freq}</b>·t + <b>${P.value}°</b>) &nbsp;|&nbsp; Período T = 1/f = <b>${(1/freq).toFixed(3)} s</b> &nbsp;|&nbsp; más frecuencia → ciclos más juntos; más fase → la onda se corre lateralmente.`;
  }
  [A,F,P].forEach(s=>s.oninput=draw);
  window.addEventListener('resize',()=>{if(current==='senales')draw();});
  draw();initFourier();
}
function initFourier(){
  const c=document.getElementById('fourierCanvas');if(!c)return;
  const N=document.getElementById('harm');
  function draw(){
    const {ctx,w,h}=dpiCanvas(c,240);
    ctx.clearRect(0,0,w,h);
    const n=+N.value,mid=h/2,amp=h*0.32;
    // ideal square (reference)
    ctx.strokeStyle='#cdbfa3';ctx.lineWidth=1.5;ctx.beginPath();
    for(let x=0;x<=w;x++){const ph=(x/w)*2*Math.PI;const sq=Math.sin(ph)>=0?1:-1;const y=mid-sq*amp;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
    // fourier sum
    ctx.strokeStyle='#e8642a';ctx.lineWidth=2.6;ctx.beginPath();
    for(let x=0;x<=w;x++){
      const ph=(x/w)*2*Math.PI;let s=0;
      for(let k=1;k<=n;k++){const hk=2*k-1;s+=Math.sin(hk*ph)/hk;}
      const y=mid-(4/Math.PI)*s*amp;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    document.getElementById('harmV').textContent=n+(n===1?' armónico':' armónicos');
    document.getElementById('fourierReadout').innerHTML=`Sumando <b>${n}</b> componente(s) impar(es). La curva naranja se acerca a la onda cuadrada gris ideal. Para bordes perfectos harían falta <b>infinitos</b> armónicos → un canal real con ancho de banda finito los recorta y deforma el pulso.`;
  }
  N.oninput=draw;draw();
}

/* ---- SNR ---- */
function modForSNR(snr){
  if(snr>=30)return['256-QAM','8 bits/símbolo — necesita SNR excelente','#3f8f54'];
  if(snr>=24)return['64-QAM','6 bits/símbolo — buen enlace','#3f8f54'];
  if(snr>=17)return['16-QAM','4 bits/símbolo — calidad media','#d9a441'];
  if(snr>=10)return['QPSK','2 bits/símbolo — robusto','#e8642a'];
  if(snr>=6)return['BPSK','1 bit/símbolo — muy robusto','#cc4444'];
  return['Sin enlace estable','SNR demasiado bajo','#cc4444'];
}
function initSNR(){
  const S=document.getElementById('snrSig'),Nz=document.getElementById('snrNoise');
  function draw(){
    const sig=+S.value,noise=+Nz.value,snr=sig-noise;
    const c=document.getElementById('snrCanvas');const {ctx,w,h}=dpiCanvas(c,170);
    ctx.clearRect(0,0,w,h);
    const toY=(d)=>h-10-((d+100)/100)*(h-30);
    ['signal','noise'].forEach(()=>{});
    // noise band
    ctx.fillStyle='rgba(204,68,68,.18)';ctx.fillRect(0,toY(noise),w,h-toY(noise)-6);
    ctx.strokeStyle='#cc4444';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,toY(noise));ctx.lineTo(w,toY(noise));ctx.stroke();ctx.setLineDash([]);
    // signal line
    ctx.strokeStyle='#1d8a8a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,toY(sig));ctx.lineTo(w,toY(sig));ctx.stroke();
    // gap arrow
    ctx.strokeStyle='#e8642a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2,toY(sig));ctx.lineTo(w/2,toY(noise));ctx.stroke();
    ctx.fillStyle='#e8642a';ctx.font='bold 13px JetBrains Mono';ctx.textAlign='center';
    ctx.fillText('SNR '+snr+' dB',w/2,(toY(sig)+toY(noise))/2-6);
    ctx.fillStyle='#1d8a8a';ctx.textAlign='left';ctx.fillText('Señal '+sig+' dBm',8,toY(sig)-7);
    ctx.fillStyle='#cc4444';ctx.fillText('Ruido '+noise+' dBm',8,toY(noise)+16);
    document.getElementById('snrSigV').textContent=sig+' dBm';
    document.getElementById('snrNoiseV').textContent=noise+' dBm';
    const m=modForSNR(snr);
    document.getElementById('snrReadout').innerHTML=`SNR = ${sig} − (${noise}) = <b>${snr} dB</b><br>Modulación sugerida: <b style="color:${m[2]}">${m[0]}</b> — ${m[1]}`;
  }
  S.oninput=draw;Nz.oninput=draw;draw();
}

/* ---- Capacidad ---- */
function fmtBps(b){
  if(b>=1e6)return (b/1e6).toFixed(2)+' Mbps';
  if(b>=1e3)return (b/1e3).toFixed(1)+' kbps';
  return Math.round(b)+' bps';
}
function fmtHz(b){
  if(b>=1e6)return (b/1e6).toFixed(2)+' MHz';
  if(b>=1e3)return (b/1e3).toFixed(0)+' kHz';
  return b+' Hz';
}
function initCapacity(){
  const B=document.getElementById('capB'),M=document.getElementById('capM'),SN=document.getElementById('capSNR');
  function draw(){
    const b=+B.value,m=+M.value,snrdb=+SN.value;
    const snrLin=Math.pow(10,snrdb/10);
    const nyq=2*b*Math.log2(m);
    const sha=b*Math.log2(1+snrLin);
    document.getElementById('capBV').textContent=fmtHz(b);
    document.getElementById('capMV').textContent=m+' niveles';
    document.getElementById('capSNRV').textContent=snrdb+' dB';
    // bars
    const c=document.getElementById('capCanvas');const {ctx,w,h}=dpiCanvas(c,190);
    ctx.clearRect(0,0,w,h);
    const max=Math.max(nyq,sha,1);
    const bars=[['Nyquist',nyq,'#1d8a8a'],['Shannon',sha,'#e8642a']];
    bars.forEach((bar,i)=>{
      const bw=w*0.34,x=w*0.13+i*w*0.43,bh=(bar[1]/max)*(h-50);
      ctx.fillStyle=bar[2];ctx.fillRect(x,h-30-bh,bw,bh);
      ctx.fillStyle='#11161f';ctx.font='bold 13px Space Grotesk';ctx.textAlign='center';
      ctx.fillText(bar[0],x+bw/2,h-10);
      ctx.fillStyle=bar[2];ctx.font='bold 12px JetBrains Mono';
      ctx.fillText(fmtBps(bar[1]),x+bw/2,h-36-bh);
    });
    document.getElementById('capReadout').innerHTML=
      `<b>Nyquist:</b> C = 2·${fmtHz(b)}·log₂(${m}) = <b>${fmtBps(nyq)}</b><br>`+
      `<b>Shannon:</b> SNR_lin = 10^(${snrdb}/10) = ${snrLin.toFixed(1)} → C = ${fmtHz(b)}·log₂(1+${snrLin.toFixed(1)}) = <b>${fmtBps(sha)}</b><br>`+
      `<span style="color:#8a8170">El menor de los dos es el límite práctico real del canal.</span>`;
  }
  [B,M,SN].forEach(s=>s.oninput=draw);draw();
}

/* ---- Códigos de línea ---- */
let lineMode='nrz';
function setLine(m,btn){document.querySelectorAll('#lineSeg button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');lineMode=m;drawLine();}
function randomBits(){const n=6+Math.floor(Math.random()*4);let s='';for(let i=0;i<n;i++)s+=Math.round(Math.random());document.getElementById('bitInput').value=s;drawLine();}
function getBits(id){return (document.getElementById(id).value.replace(/[^01]/g,'')||'0').split('').map(Number);}
function drawLine(){
  const bits=getBits('bitInput');
  const c=document.getElementById('lineCanvas');const {ctx,w,h}=dpiCanvas(c,170);
  ctx.clearRect(0,0,w,h);
  const n=bits.length,bw=w/n,hi=h*0.25,lo=h*0.75,mid=h*0.5;
  // grid + bit labels
  ctx.strokeStyle='#e5dcc9';ctx.lineWidth=1;ctx.font='12px JetBrains Mono';ctx.fillStyle='#8a8170';ctx.textAlign='center';
  bits.forEach((b,i)=>{ctx.beginPath();ctx.moveTo(i*bw,0);ctx.lineTo(i*bw,h);ctx.stroke();ctx.fillText(b,i*bw+bw/2,16);});
  ctx.beginPath();ctx.moveTo(w,0);ctx.lineTo(w,h);ctx.stroke();
  ctx.strokeStyle='#e8642a';ctx.lineWidth=2.8;ctx.beginPath();
  let prevY,ami=1,nrziLevel=hi,desc='';
  if(lineMode==='nrz'){
    desc='NRZ: 1 = nivel alto, 0 = nivel bajo, constante todo el bit. Cadenas largas iguales → pierde sincronía.';
    bits.forEach((b,i)=>{const y=b?hi:lo;if(i===0)ctx.moveTo(0,y);else ctx.lineTo(i*bw,y);ctx.lineTo((i+1)*bw,y);});
  }else if(lineMode==='nrzi'){
    desc='NRZI: hay transición al inicio del bit cuando es 1; sin transición cuando es 0. Codifica por cambio, no por nivel absoluto.';
    let lvl=lo;ctx.moveTo(0,lvl);
    bits.forEach((b,i)=>{if(b)lvl=lvl===hi?lo:hi;ctx.lineTo(i*bw,lvl);ctx.lineTo((i+1)*bw,lvl);});
  }else if(lineMode==='manch'){
    desc='Manchester: transición en el MEDIO de cada bit (0: alto→bajo, 1: bajo→alto). Excelente sincronización; usa más ancho de banda.';
    bits.forEach((b,i)=>{const x=i*bw;
      const first=b?lo:hi,second=b?hi:lo;
      if(i===0)ctx.moveTo(x,first);else ctx.lineTo(x,first);
      ctx.lineTo(x+bw/2,first);ctx.lineTo(x+bw/2,second);ctx.lineTo(x+bw,second);
    });
  }else if(lineMode==='ami'){
    desc='AMI: los 1 alternan polaridad (+/−) respecto del eje; los 0 = sin pulso (nivel medio). Reduce componente DC.';
    ctx.moveTo(0,mid);
    bits.forEach((b,i)=>{const x=i*bw;
      if(b){const y=ami>0?hi:lo;ami*=-1;ctx.lineTo(x,mid);ctx.lineTo(x,y);ctx.lineTo(x+bw,y);ctx.lineTo(x+bw,mid);}
      else{ctx.lineTo(x+bw,mid);}
    });
  }
  ctx.stroke();
  // baseline for ami
  if(lineMode==='ami'){ctx.strokeStyle='#cdbfa3';ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();ctx.setLineDash([]);}
  document.getElementById('lineReadout').innerHTML=desc;
}
function initLine(){document.getElementById('bitInput').oninput=drawLine;drawLine();}

/* ---- Modulación ---- */
let modMode='ask';
function setMod(m,btn){document.querySelectorAll('#modSeg button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');modMode=m;drawMod();}
function randModBits(){const n=4;let s='';for(let i=0;i<n;i++)s+=Math.round(Math.random());document.getElementById('modBits').value=s;drawMod();}
function drawMod(){
  const bits=getBits('modBits');
  const c=document.getElementById('modCanvas');const {ctx,w,h}=dpiCanvas(c,190);
  ctx.clearRect(0,0,w,h);
  const n=bits.length,bw=w/n,mid=h*0.58,amp=h*0.3;
  // bit labels + grid
  ctx.strokeStyle='#e5dcc9';ctx.lineWidth=1;ctx.font='12px JetBrains Mono';ctx.fillStyle='#8a8170';ctx.textAlign='center';
  bits.forEach((b,i)=>{ctx.beginPath();ctx.moveTo(i*bw,0);ctx.lineTo(i*bw,h);ctx.stroke();ctx.fillText(b,i*bw+bw/2,16);});
  ctx.beginPath();ctx.moveTo(w,0);ctx.lineTo(w,h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.strokeStyle='#cdbfa3';ctx.stroke();
  let desc='';
  ctx.strokeStyle='#e8642a';ctx.lineWidth=2.4;ctx.beginPath();
  const baseCycles=6;
  for(let x=0;x<=w;x++){
    const i=Math.min(n-1,Math.floor(x/bw));const b=bits[i];
    let a=amp,freq=baseCycles,ph=0;
    if(modMode==='ask'){a=b?amp:amp*0.18;}
    else if(modMode==='fsk'){freq=b?baseCycles*1.7:baseCycles*0.85;}
    else if(modMode==='psk'){ph=b?Math.PI:0;}
    const y=mid-Math.sin((x/w)*freq*2*Math.PI+ph)*a;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  if(modMode==='ask')desc='<b>ASK</b> — el 1 usa amplitud alta y el 0 amplitud baja/nula. Simple pero muy sensible al ruido de amplitud.';
  if(modMode==='fsk')desc='<b>FSK</b> — el 1 usa una frecuencia más alta y el 0 una más baja. Robusto ante variaciones de amplitud; ocupa más ancho de banda.';
  if(modMode==='psk')desc='<b>PSK</b> — el 1 invierte la fase 180° respecto del 0 (mirá el salto en los cruces de bit). Buena eficiencia; exige detectar la fase con precisión.';
  document.getElementById('modReadout').innerHTML=desc;
}
function initModulation(){document.getElementById('modBits').oninput=drawMod;drawMod();initConst();}

/* ---- Constelación ---- */
let constM=16,constAnim;
function setConst(m,btn){document.querySelectorAll('#constSeg button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');constM=m;}
function initConst(){
  const c=document.getElementById('constCanvas');if(!c)return;
  const NZ=document.getElementById('constNoise');
  cancelAnimationFrame(constAnim);
  function draw(){
    const {ctx,w,h}=dpiCanvas(c,320);
    ctx.clearRect(0,0,w,h);
    const side=Math.sqrt(constM),cx=w/2,cy=h/2,scale=Math.min(w,h)*0.36;
    const noise=+NZ.value/100;
    // axes
    ctx.strokeStyle='#e5dcc9';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,10);ctx.lineTo(cx,h-10);ctx.moveTo(20,cy);ctx.lineTo(w-20,cy);ctx.stroke();
    ctx.fillStyle='#8a8170';ctx.font='11px JetBrains Mono';ctx.textAlign='left';
    ctx.fillText('I',w-30,cy-6);ctx.fillText('Q',cx+6,18);
    const step=(side-1)/2;
    const minDist=scale/step/( side>1?1:1);
    for(let r=0;r<side;r++)for(let q=0;q<side;q++){
      const I=(q-step)/Math.max(step,1),Q=(r-step)/Math.max(step,1);
      const px=cx+I*scale,py=cy-Q*scale;
      // noise scatter
      const spread=noise*scale/Math.max(step,1)*0.9;
      const nx=px+(Math.random()-0.5)*spread*2,ny=py+(Math.random()-0.5)*spread*2;
      ctx.beginPath();ctx.arc(nx,ny,2.2,0,7);
      ctx.fillStyle='rgba(232,100,42,.45)';ctx.fill();
      ctx.beginPath();ctx.arc(px,py,3.4,0,7);
      ctx.fillStyle='#1d8a8a';ctx.fill();
    }
    const bits=Math.log2(constM);
    const cellHalf=scale/Math.max(step,1)/2;
    const overlap=(noise*scale/Math.max(step,1)*0.9) > cellHalf;
    document.getElementById('constNoiseV').textContent=NZ.value+'%';
    document.getElementById('constReadout').innerHTML=
      `<b>${constM} símbolos</b> = log₂(${constM}) = <b>${bits} bits/símbolo</b>. `+
      (overlap?'<b style="color:#cc4444">El ruido hace que las nubes se solapen → el receptor confunde símbolos. Conviene bajar a una modulación menos densa.</b>'
              :'<b style="color:#3f8f54">Las nubes están separadas: el receptor distingue cada símbolo correctamente.</b>');
    constAnim=requestAnimationFrame(draw);
  }
  NZ.oninput=()=>{};draw();
}

/* ---- PCM ---- */
function initPCM(){
  const R=document.getElementById('pcmRate'),L=document.getElementById('pcmLevels');
  function draw(){
    const rate=+R.value,levels=Math.pow(2,+L.value);
    const c=document.getElementById('pcmCanvas');const {ctx,w,h}=dpiCanvas(c,240);
    ctx.clearRect(0,0,w,h);
    const mid=h/2,amp=h*0.34;
    // quant grid
    ctx.strokeStyle='#eee4d0';ctx.lineWidth=1;
    for(let l=0;l<levels;l++){const y=mid-amp+(2*amp)*(l/(levels-1));ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    // analog signal
    const sig=x=>Math.sin((x/w)*2*Math.PI)*0.6+Math.sin((x/w)*4*Math.PI+1)*0.3;
    ctx.strokeStyle='#1d8a8a';ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<=w;x++){const y=mid-sig(x)*amp;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
    // samples + quantized steps
    ctx.fillStyle='#e8642a';
    let codes=[];
    for(let s=0;s<rate;s++){
      const x=(s+0.5)/rate*w;const v=sig(x);
      // quantize to level
      const norm=(v+1)/2;let lvl=Math.round(norm*(levels-1));lvl=Math.max(0,Math.min(levels-1,lvl));
      const qy=mid-amp+(2*amp)*(1-lvl/(levels-1));
      const y=mid-v*amp;
      ctx.beginPath();ctx.moveTo(x,mid+amp);ctx.lineTo(x,qy);ctx.strokeStyle='rgba(232,100,42,.3)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.beginPath();ctx.arc(x,qy,3.5,0,7);ctx.fill();
      codes.push(lvl.toString(2).padStart(+L.value,'0'));
    }
    document.getElementById('pcmRateV').textContent=rate+' /ciclo';
    document.getElementById('pcmLevelsV').textContent=levels+' niv ('+L.value+' bit)';
    const shown=codes.slice(0,6).join(' ');
    document.getElementById('pcmReadout').innerHTML=
      `Muestreo: <b>${rate}</b> muestras/ciclo &nbsp;|&nbsp; Cuantificación: <b>${levels}</b> niveles → <b>${L.value} bit</b> por muestra.<br>`+
      `Códigos (primeros): <span class="mono">${shown}…</span><br>`+
      `<span style="color:#8a8170">Más muestras y más niveles → reconstrucción más fiel, pero más bits a transmitir.</span>`;
  }
  R.oninput=draw;L.oninput=draw;draw();
}

/* ---- Multiplexación ---- */
let muxMode='fdm',muxAnim;
function setMux(m,btn){document.querySelectorAll('#muxSeg button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');muxMode=m;}
function initMux(){
  const c=document.getElementById('muxCanvas');if(!c)return;
  cancelAnimationFrame(muxAnim);let t=0;
  const cols=['#e8642a','#1d8a8a','#2f5fb0'];const names=['A','B','C'];
  function draw(){
    const {ctx,w,h}=dpiCanvas(c,240);
    ctx.clearRect(0,0,w,h);
    if(muxMode==='fdm'){
      const bandH=(h-30)/3;
      for(let k=0;k<3;k++){
        const yTop=10+k*bandH;
        ctx.fillStyle='rgba(0,0,0,.02)';ctx.fillRect(0,yTop,w,bandH-6);
        ctx.strokeStyle=cols[k];ctx.lineWidth=2;ctx.beginPath();
        const f=(k+2)*1.4,a=bandH*0.32,mid=yTop+bandH/2-3;
        for(let x=0;x<=w;x++){const y=mid-Math.sin((x/w)*f*2*Math.PI+t*0.05)*a;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
        ctx.stroke();
        ctx.fillStyle=cols[k];ctx.font='bold 12px Space Grotesk';ctx.textAlign='left';
        ctx.fillText('Canal '+names[k]+' · f'+(k+1),8,yTop+15);
      }
      document.getElementById('muxReadout').innerHTML='<b>FDM</b> — cada canal ocupa su propia banda de frecuencia. Todos transmiten <b>al mismo tiempo</b>, separados en el espectro por bandas de guarda. Natural para señales analógicas (radio, TV por cable).';
    }else{
      const slots=12,sw=w/slots,rowH=(h-30)/1;
      const isStat=muxMode==='stat';
      // pattern of which source occupies each slot
      let pattern=[];for(let i=0;i<slots;i++){pattern.push(i%3);}
      if(isStat){pattern=[0,2,0,0,2,1,0,2,0,1,2,0];} // B casi sin datos
      const offset=Math.floor(t/14)%slots;
      for(let i=0;i<slots;i++){
        const x=i*sw;const src=pattern[i];
        const active=((i-offset+slots)%slots)<3;
        ctx.fillStyle=src===null?'#eee':cols[src];
        ctx.globalAlpha=active?1:0.32;
        ctx.fillRect(x+2,h/2-32,sw-4,64);
        ctx.globalAlpha=1;
        ctx.fillStyle='#fff';ctx.font='bold 15px Space Grotesk';ctx.textAlign='center';
        ctx.fillText(names[src],x+sw/2,h/2+6);
      }
      ctx.fillStyle='#11161f';ctx.font='12px JetBrains Mono';ctx.textAlign='left';
      ctx.fillText('tiempo →',6,h-8);
      if(muxMode==='tdm')
        document.getElementById('muxReadout').innerHTML='<b>TDM síncrona</b> — el tiempo se divide en ranuras fijas; cada fuente usa su turno (A, B, C, A, B, C…). Si una fuente no tiene datos, su slot igual queda reservado y se desperdicia. Ideal para señales digitales.';
      else
        document.getElementById('muxReadout').innerHTML='<b>TDM estadística</b> — las ranuras se asignan <b>solo a fuentes con datos</b>. Notá que B (que casi no transmite) aparece poco: el enlace se aprovecha mejor con tráfico irregular, a costa de necesitar buffer y direccionamiento.';
    }
    t++;muxAnim=requestAnimationFrame(draw);
  }
  draw();
}

/* ---- Conmutación ---- */
let swMode='circ',swAnim;
function setSwitch(m,btn){document.querySelectorAll('#swSeg button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');swMode=m;}
function initSwitch(){
  const c=document.getElementById('swCanvas');if(!c)return;
  cancelAnimationFrame(swAnim);let t=0;
  // node grid
  const nodes=[[60,120,'A'],[230,55,''],[230,185,''],[420,55,''],[420,185,''],[590,120,'B']];
  const edges=[[0,1],[0,2],[1,2],[1,3],[2,4],[3,4],[3,5],[4,5],[2,3]];
  function draw(){
    const {ctx,w,h}=dpiCanvas(c,240);
    ctx.clearRect(0,0,w,h);
    const sx=w/650;
    const N=nodes.map(n=>[n[0]*sx,n[1],n[2]]);
    // edges
    ctx.strokeStyle='#d8cdb9';ctx.lineWidth=2;
    edges.forEach(e=>{ctx.beginPath();ctx.moveTo(N[e[0]][0],N[e[0]][1]);ctx.lineTo(N[e[1]][0],N[e[1]][1]);ctx.stroke();});
    if(swMode==='circ'){
      const route=[0,1,3,5];
      ctx.strokeStyle='#1d8a8a';ctx.lineWidth=5;ctx.beginPath();
      route.forEach((r,i)=>{i===0?ctx.moveTo(N[r][0],N[r][1]):ctx.lineTo(N[r][0],N[r][1]);});ctx.stroke();
      // moving bit on reserved route
      const seg=(t*0.01)%(route.length-1);const i=Math.floor(seg),f=seg-i;
      const a=N[route[i]],b=N[route[i+1]];
      const px=a[0]+(b[0]-a[0])*f,py=a[1]+(b[1]-a[1])*f;
      ctx.beginPath();ctx.arc(px,py,7,0,7);ctx.fillStyle='#e8642a';ctx.fill();
      document.getElementById('swReadout').innerHTML='<b>Circuitos</b> — se reserva una <b>ruta dedicada</b> (verde) de extremo a extremo antes de transmitir. El retardo es estable, pero los recursos quedan ocupados aunque no fluyan datos. (Telefonía tradicional.)';
    }else{
      const routes=[[0,1,3,5],[0,2,4,5],[0,2,3,5]];
      const pcols=['#e8642a','#1d8a8a','#2f5fb0'];
      routes.forEach((route,k)=>{
        const seg=((t*0.012)+k*0.9)%(route.length-1);const i=Math.floor(seg),f=seg-i;
        const a=N[route[i]],b=N[route[i+1]];
        const px=a[0]+(b[0]-a[0])*f,py=a[1]+(b[1]-a[1])*f;
        ctx.beginPath();ctx.rect(px-7,py-7,14,14);ctx.fillStyle=pcols[k];ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';ctx.fillText('P'+(k+1),px,py+3);
      });
      document.getElementById('swReadout').innerHTML='<b>Paquetes</b> — el mensaje se trocea en paquetes (P1, P2, P3) que viajan <b>independientes</b> por rutas distintas, compartiendo enlaces. Eficiente y tolerante a fallas, pero pueden llegar desordenados y con retardo variable. (Internet.)';
    }
    // nodes on top
    N.forEach(n=>{ctx.beginPath();ctx.arc(n[0],n[1],n[2]?16:9,0,7);ctx.fillStyle=n[2]?'#11161f':'#6b7587';ctx.fill();
      if(n[2]){ctx.fillStyle='#fff';ctx.font='bold 14px Space Grotesk';ctx.textAlign='center';ctx.fillText(n[2],n[0],n[1]+5);}});
    t++;swAnim=requestAnimationFrame(draw);
  }
  draw();
}

/* ---- TCP layers ---- */
function initTcp(){
  const info=['<b>Aplicación</b> — protocolos usados por programas: HTTP, DNS, SMTP, FTP.',
    '<b>Transporte</b> — comunicación extremo a extremo: TCP (confiable, con ACK) y UDP (rápido, sin garantías), puertos.',

  document.querySelectorAll('.tcpL').forEach(g=>{

/* =========================================================
   QUIZ LOGIC
   ========================================================= */
let qAnswers={};
function initQuiz(){renderQuiz();}
function resetQuiz(){qAnswers={};renderQuiz();}
function renderQuiz(){
  const box=document.getElementById('quizBox');if(!box)return;
  box.innerHTML=QUIZ.map((item,qi)=>{
    const answered=qi in qAnswers;
    return `<div class="q-card">
      <div class="q-num">Pregunta ${qi+1} de ${QUIZ.length}</div>
      <div class="q-text">${item.q}</div>
      ${item.o.map((opt,oi)=>{
        let cls='opt';
        if(answered){cls+=' locked';
          if(oi===item.c)cls+=' correct';
          else if(oi===qAnswers[qi]&&qAnswers[qi]!==item.c)cls+=' wrong';
        }
        return `<button class="${cls}" ${answered?'':`onclick="answerQ(${qi},${oi})"`}><span class="k">${String.fromCharCode(65+oi)}</span>${opt}</button>`;
      }).join('')}
      <div class="q-feedback ${answered?(qAnswers[qi]===item.c?'ok show':'no show'):''}">
        ${answered?(qAnswers[qi]===item.c?'✓ Correcto. ':'✗ Incorrecto. ')+item.e:''}
      </div>
    </div>`;
  }).join('');
  updateQuizScore();
}
function answerQ(qi,oi){qAnswers[qi]=oi;renderQuiz();}
function updateQuizScore(){
  const ans=Object.keys(qAnswers).length;
  const score=Object.entries(qAnswers).filter(([k,v])=>QUIZ[k].c===v).length;
  const se=document.getElementById('qScore'),ae=document.getElementById('qAnswered');
  if(se)se.textContent=score;if(ae)ae.textContent=ans;
  const done=document.getElementById('quizDone');
  if(ans===QUIZ.length){
    done.style.display='block';
    const pct=Math.round(score/QUIZ.length*100);
    let msg;
    if(pct>=85)msg=`🎯 <b>${score}/${QUIZ.length} (${pct}%)</b> — Excelente, dominás la unidad. ¡A rendir con confianza!`;
    else if(pct>=60)msg=`👍 <b>${score}/${QUIZ.length} (${pct}%)</b> — Buen nivel. Repasá los temas donde fallaste y volvé a intentar.`;
    else msg=`📚 <b>${score}/${QUIZ.length} (${pct}%)</b> — Conviene volver a la teoría de los módulos antes de seguir. ¡Vas a mejorar!`;
    document.getElementById('quizFinalMsg').innerHTML=msg;
  }else if(done){done.style.display='none';}
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
let flashIdx=0,flashFlipped=false;
function initFlash(){flashIdx=0;flashFlipped=false;showCard();}
function showCard(){
  const card=FLASH[flashIdx];
  document.getElementById('flashQ').textContent=card.f;
  document.getElementById('flashA').textContent=card.b;
  document.getElementById('flashCount').textContent=`${flashIdx+1} / ${FLASH.length}`;
  flashFlipped=false;
  document.getElementById('flashInner').style.transform='none';
}
function flipCard(){flashFlipped=!flashFlipped;document.getElementById('flashInner').style.transform=flashFlipped?'rotateY(180deg)':'none';}
function nextCard(){flashIdx=(flashIdx+1)%FLASH.length;showCard();}
function prevCard(){flashIdx=(flashIdx-1+FLASH.length)%FLASH.length;showCard();}
